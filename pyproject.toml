[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patterson-research-lab"
version = "0.1.0"
description = "Evidence-grounded autonomous digital research backend"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["research_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
