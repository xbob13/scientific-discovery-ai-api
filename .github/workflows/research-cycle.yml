name: Bounded digital research cycle

on:
  workflow_dispatch:
    inputs:
      question:
        description: Research question or search objective
        required: true
        type: string
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: autonomous-research-cycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./research_lab.db
      BACKEND_SERVICE_TOKEN: ${{ secrets.BACKEND_SERVICE_TOKEN }}
      RESEARCH_KILL_SWITCH: ${{ vars.RESEARCH_KILL_SWITCH || 'true' }}
      RESEARCH_QUESTION: ${{ inputs.question || vars.RESEARCH_QUESTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore research state
        uses: actions/cache/restore@v4
        with:
          path: research_lab.db
          key: research-state-${{ github.run_id }}
          restore-keys: research-state-
      - name: Refuse an unconfigured run
        shell: bash
        run: |
          test -n "$RESEARCH_QUESTION"
          test "$RESEARCH_KILL_SWITCH" = "false"
      - name: Run bounded cycle
        run: python scripts/run_research_cycle.py --question "$RESEARCH_QUESTION"
      - name: Save research state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research_lab.db
          key: research-state-${{ github.run_id }}
      - name: Upload inspectable evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-cycle-${{ github.run_id }}
          path: outputs/latest-cycle.json
          if-no-files-found: warn
          retention-days: 30
